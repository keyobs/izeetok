name: Deploy develop to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm + Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.0.9
          runtime: node@24
          install: false

      - name: Configure private registry auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BASE_PATH: "/izeetok/"
          PULSEPIT_ENV: "staging"
        run: pnpm build

      - name: SPA fallback for GitHub Pages (no server-side rewrites there)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  open-main-pr:
    name: Open the develop -> main PR
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or update the develop -> main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          COUNT="$(git rev-list --count origin/main..HEAD)"

          if [ "$COUNT" -eq 0 ]; then
            echo "develop has no commits ahead of main, nothing to do."
            exit 0
          fi

          LATEST_SUBJECT="$(git log -1 --pretty=format:'%s' origin/main..HEAD)"
          if [ "$COUNT" -eq 1 ]; then
            TITLE="$LATEST_SUBJECT"
          else
            TITLE="$LATEST_SUBJECT (+$((COUNT - 1)) more)"
          fi

          BODY="Opened automatically after a green deploy on develop (tests, build and GitHub Pages deploy all passed).

          ## Commits ($COUNT)
          $(git log --pretty=format:'- %s (%h)' origin/main..HEAD)"

          EXISTING_PR="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')"
          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR with the latest commits."
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head develop --title "$TITLE" --body "$BODY"
          fi
