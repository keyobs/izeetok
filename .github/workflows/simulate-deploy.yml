name: Simulate deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to simulate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Simulation complete
        run: echo "Build succeeded for '${{ inputs.ref || github.ref_name }}' - Vercel's own git integration will build and deploy this the same way once it reaches its production branch."
